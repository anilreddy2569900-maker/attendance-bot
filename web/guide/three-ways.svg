<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" role="img" aria-label="Three ways to add students: an Excel or CSV file, a text file, or pasting a list">
<style>
text{font-family:system-ui,Segoe UI,Arial,sans-serif}
.card{opacity:0;animation:up .6s forwards}
.c2{animation-delay:.5s}.c3{animation-delay:1s}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.cursor{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}.pulse{opacity:.25!important}}
</style>
<g class="card">
<rect x="10" y="10" width="210" height="240" rx="12" fill="#fff" stroke="#d5d9e0"/>
<rect x="10" y="10" width="210" height="44" rx="12" fill="#e2f3e9"/><rect x="10" y="40" width="210" height="14" fill="#e2f3e9"/>
<text x="26" y="39" font-size="17" font-weight="700" fill="#177245">1 · Excel / CSV</text>
<rect x="28" y="72" width="174" height="24" fill="#e8f0fe"/><text x="36" y="89" font-size="13" font-weight="700">Name</text><text x="120" y="89" font-size="13" font-weight="700">UG Number</text>
<g font-size="13"><rect x="28" y="96" width="174" height="24" fill="none" stroke="#e3e5e9"/><text x="36" y="113">Rohan Mehta</text><text x="120" y="113">41923</text>
<rect x="28" y="120" width="174" height="24" fill="none" stroke="#e3e5e9"/><text x="36" y="137">Simran Kaur</text><text x="120" y="137">43517</text></g>
<text x="28" y="180" font-size="13" fill="#444">Best for a class list you</text><text x="28" y="198" font-size="13" fill="#444">keep and reuse.</text>
<text x="28" y="228" font-size="13" fill="#6b7280">Save as .xlsx or .csv</text>
</g>
<g class="card c2">
<rect x="245" y="10" width="210" height="240" rx="12" fill="#fff" stroke="#d5d9e0"/>
<rect x="245" y="10" width="210" height="44" rx="12" fill="#e2edfa"/><rect x="245" y="40" width="210" height="14" fill="#e2edfa"/>
<text x="261" y="39" font-size="17" font-weight="700" fill="#1f5fa8">2 · Text file</text>
<rect x="263" y="72" width="174" height="76" fill="#fffef5" stroke="#e3e5e9"/>
<g font-family="Consolas,monospace" font-size="13"><text x="271" y="94">Rohan Mehta 41923</text><text x="271" y="114">Simran Kaur 43517</text><text x="271" y="134">Aarav Singh 40876<tspan class="cursor">|</tspan></text></g>
<text x="263" y="180" font-size="13" fill="#444">Type in Notepad,</text><text x="263" y="198" font-size="13" fill="#444">one student per line.</text>
<text x="263" y="228" font-size="13" fill="#6b7280">Save as .txt</text>
</g>
<g class="card c3">
<rect x="480" y="10" width="210" height="240" rx="12" fill="#fff" stroke="#d5d9e0"/>
<rect x="480" y="10" width="210" height="44" rx="12" fill="#fdf0d5"/><rect x="480" y="40" width="210" height="14" fill="#fdf0d5"/>
<text x="496" y="39" font-size="17" font-weight="700" fill="#92600a">3 · Paste</text>
<rect x="498" y="72" width="174" height="76" rx="6" fill="#fff" stroke="#9aa3b2"/>
<g font-size="13"><text x="506" y="94">Rohan Mehta 41923</text><text x="506" y="114">Simran Kaur 43517</text></g>
<rect x="540" y="156" width="90" height="26" rx="13" fill="#2f5d3f"/><text x="556" y="174" font-size="12" fill="#fff" font-weight="700">Add list</text>
<text x="498" y="206" font-size="13" fill="#444">Copy lines from anywhere</text><text x="498" y="224" font-size="13" fill="#444">and paste. No file needed.</text>
</g>
</svg>
